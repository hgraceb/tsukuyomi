name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze & Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.38.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install plugin example dependencies
        run: flutter pub get
        working-directory: packages/tsukuyomi_metadata/example

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run package tests
        run: |
          for pkg in tsukuyomi_eval tsukuyomi_html tsukuyomi_list tsukuyomi_metadata tsukuyomi_pixel_snap; do
            echo "::group::$pkg"
            cd "packages/$pkg"
            flutter pub get
            flutter test
            cd ../..
            echo "::endgroup::"
          done

      - name: Run app tests
        run: flutter test

  build-windows:
    name: Build Windows (debug)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.38.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows
        run: flutter build windows --debug
