name: tsukuyomi
description: Tsukuyomi is an open-source manga reader built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.10.0-290.4.beta <4.0.0"
  flutter: ">=3.38.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # 添加默认本地化语言
  flutter_localizations:
    sdk: flutter

  # 代码解释
  tsukuyomi_eval:
    path: packages/tsukuyomi_eval
  # 网页解析
  tsukuyomi_html:
    path: packages/tsukuyomi_html
  # 列表组件
  tsukuyomi_list:
    path: packages/tsukuyomi_list
  # 平台数据
  tsukuyomi_metadata:
    path: packages/tsukuyomi_metadata
  # 临时补丁
  tsukuyomi_patch:
    path: packages/tsukuyomi_patch
  # 像素对齐
  tsukuyomi_pixel_snap:
    path: packages/tsukuyomi_pixel_snap
  # 漫画源
  tsukuyomi_source:
    path: packages/tsukuyomi_source

  # 路由导航
  go_router: 6.5.9
  # 本地键值对储存
  shared_preferences: 2.5.3
  # Riverpod 状态管理
  flutter_riverpod: 2.6.1
  # Riverpod 代码生成
  riverpod_annotation: 2.6.1
  # Freezed 代码生成
  freezed_annotation: 2.4.4
  # JSON 代码生成
  json_annotation: 4.9.0
  # Drift 持久化库
  drift: 2.21.0
  # SQLite3 原生库
  sqlite3_flutter_libs: 0.5.40
  # 通用文件路径
  path_provider: 2.1.5
  # 通用路径操作
  path: 1.9.1
  # 图片下载和缓存
  cached_network_image: 3.4.1
  # 本地缓存文件管理
  flutter_cache_manager: 3.4.1
  # 动画效果
  flutter_animate: 4.5.2
  # Sliver 组件扩展
  sliver_tools: 0.2.12
  # 集合操作
  collection: 1.19.1
  # 网络请求
  dio: 5.11.1
  # 软键盘可见性
  flutter_keyboard_visibility: 6.0.0
  # 数据编解码
  convert: 3.1.2
  # 数据加解密
  encrypt: 5.0.3
  # 哈希计算
  crypto: 3.0.7
  # 压缩解压
  archive: 3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

  # 代码生成工具：dart run build_runner build --delete-conflicting-outputs
  build_runner: 2.4.13
  # 生成代码合并配置
  source_gen: 1.5.0
  # 代码检查工具：dart run custom_lint
  custom_lint: 0.5.11
  # Riverpod 代码生成
  riverpod_generator: 2.3.10
  # Riverpod 代码检查
  riverpod_lint: 2.3.8
  # Freezed 代码生成
  freezed: 2.5.2
  # JSON 代码生成
  json_serializable: 6.8.0
  # Drift 代码生成
  drift_dev: 2.21.2
  # Drift 代码生成
  build_web_compilers: 4.4.1

flutter:
  # 启用本地化配置文件生成: flutter gen-l10n
  generate: true

  # Material Icons font
  uses-material-design: true

  # 资源文件
  assets:
    - assets/interpreter/
    - assets/sources/
