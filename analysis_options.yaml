include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 140
  trailing_commas: preserve

linter:
  rules:
    - unawaited_futures
    - unnecessary_breaks
    - combinators_ordering

analyzer:
  exclude:
    - build/**
  plugins:
    # https://riverpod.dev/docs/introduction/getting_started#enabling-riverpod_lintcustom_lint
    - custom_lint

custom_lint:
  rules:
    # Riverpod 作者回复说不支持与变量赋值一起使用：https://github.com/rrousselGit/riverpod/issues/3152
    - avoid_manual_providers_as_generated_provider_dependency: false
